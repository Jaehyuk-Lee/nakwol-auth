name: Verify NAKWOL AUTH

on:
  pull_request:
    branches:
      - dev
      - main
      - stable
    paths:
      - 'src/**'
      - 'tests/**'
      - 'packages/**'
      - 'migrations/**'
      - 'scripts/**'
      - 'package.json'
      - 'tsconfig.json'
      - 'wrangler.jsonc'
      - '.github/workflows/verify.yml'
      - '.github/workflows/deploy.yml'
      - '.github/workflows/repository-governance.yml'
      - 'BRANCHING.md'
      - 'CODEX_HANDOFF.md'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      - name: Unit tests
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Bundle check
        run: npx wrangler deploy --dry-run --outdir .dry-run
      - name: Verify NAKWOL Connect v0.7 assets
        shell: bash
        run: |
          set -euo pipefail
          grep -q "registerConnectRoutes" src/sdk-entry.ts
          grep -q "registerConnectCliRoutes" src/sdk-entry.ts
          grep -q "registerConnectCliDistributionRoutes" src/sdk-entry.ts
          grep -q "connect/v1.js" src/connect.ts
          grep -q "connect_cli_tokens" migrations/0004_nakwol_connect_cli.sql
          grep -q "window.NAKWOL_DATA" src/assets/nakwol-connect-v1.js.txt
          grep -q "X-NAKWOL-CLIENT-ID" src/assets/nakwol-connect-v1.js.txt
          grep -q "openapi: dataOpenApi" src/assets/nakwol-connect-v1.js.txt
          grep -q "script.dataset.auth || 'required'" src/assets/nakwol-connect-v1.js.txt
          grep -q "CONNECT_CLI_VERSION = '0.7.0'" src/connect-cli-distribution.ts
          grep -q "default_auth:'required'" src/connect-cli-distribution.ts
          grep -q "init --auth optional" src/connect-cli-distribution.ts
          grep -q "init --scopes roster:read,decks:read" src/connect-cli-distribution.ts
          grep -q "data describe --json" src/connect-cli-distribution.ts
          grep -q "data_openapi" src/connect-cli-distribution.ts
          grep -q "Verify production AUTH and Connect v0.7 distribution" .github/workflows/deploy.yml
          grep -q '"version":"0.7.0"' .github/workflows/deploy.yml
          grep -q '"default_auth":"required"' .github/workflows/deploy.yml
          test -s src/assets/nakwol-connect-cli.tgz.b64.js.txt
          echo 'NAKWOL_CONNECT_V07_STATIC_CHECK_OK'
