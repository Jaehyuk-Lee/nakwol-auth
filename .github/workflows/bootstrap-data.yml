name: Bootstrap NAKWOL DATA

on:
  workflow_dispatch:
  push:
    branches: [stable]
    paths: ['ops/data-bootstrap.flag']

permissions:
  contents: read
  pull-requests: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: services/data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify stable PR promotion or stable manual ref
        working-directory: ${{ github.workspace }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/verify-stable-promotion.mjs --allow-head main --allow-prefix hotfix/
      - name: Install DATA dependencies
        run: npm install --legacy-peer-deps
      - name: Verify DATA v0.9
        run: |
          npm test
          npm run typecheck
          npm run bundle
      - name: Resolve or create exact DATA D1
        run: node scripts/ensure-d1.mjs --create-if-missing
      - name: Apply DATA migrations
        run: npx wrangler d1 migrations apply DB --remote
      - name: Seed DATA Registry
        run: npm run registry:seed:remote
      - name: Verify DATA Registry counts
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute DB --remote --json --command "SELECT (SELECT COUNT(*) FROM game_generals) AS generals,(SELECT COUNT(*) FROM game_generals WHERE enabled=1) AS generals_enabled,(SELECT COUNT(*) FROM game_tactics) AS tactics,(SELECT COUNT(*) FROM game_equipment_templates) AS equipment,(SELECT COUNT(*) FROM game_stat_types) AS stat_types,(SELECT COUNT(*) FROM game_formations) AS formations,(SELECT COUNT(*) FROM game_warbooks) AS warbooks,(SELECT COUNT(*) FROM game_equipment_traits WHERE kind='skill' AND evidence_state='canonical') AS traits_skill,(SELECT COUNT(*) FROM game_equipment_traits WHERE kind='effect' AND evidence_state='canonical') AS traits_effect,(SELECT COUNT(*) FROM game_equipment_trait_applicability WHERE evidence_state='canonical') AS traits_applicability;" > /tmp/data-registry.json
          node - <<'NODE'
          const fs = require('fs'); const payload=JSON.parse(fs.readFileSync('/tmp/data-registry.json','utf8'));
          function find(v){if(!v||typeof v!=='object')return null;if(v.generals===209&&v.generals_enabled===140)return v;for(const c of Object.values(v)){if(Array.isArray(c)){for(const i of c){const f=find(i);if(f)return f;}}else{const f=find(c);if(f)return f;}}return null;}
          const row=find(payload); if(!row||row.tactics!==1077||row.equipment!==134||row.stat_types!==281||row.formations!==8||row.warbooks!==442||row.traits_skill!==106||row.traits_effect!==74||row.traits_applicability!==0) process.exit(1);
          NODE
          echo 'NAKWOL_DATA_REGISTRY_COUNTS_OK'
      - name: Deploy DATA Worker
        run: npx wrangler deploy --keep-vars
      - name: Verify production DATA v0.9
        shell: bash
        run: |
          set -euo pipefail
          origin='https://nakwol-data.sepsd21.workers.dev'
          for i in {1..12}; do
            health=$(curl -sS -H 'Cache-Control: no-cache' -o /tmp/data-health.json -w '%{http_code}' "$origin/api/health" || true)
            schema=$(curl -sS -H 'Cache-Control: no-cache' -o /tmp/data-schema.json -w '%{http_code}' "$origin/api/schema" || true)
            openapi=$(curl -sS -H 'Cache-Control: no-cache' -o /tmp/data-openapi.json -w '%{http_code}' "$origin/openapi.json" || true)
            echo "attempt=$i health=$health schema=$schema openapi=$openapi"
            if [ "$health" = '200' ] && [ "$schema" = '200' ] && [ "$openapi" = '200' ] && grep -q '"service":"nakwol-data"' /tmp/data-health.json && grep -q '"version":"0.9.0"' /tmp/data-health.json && grep -q '"schema_version":4' /tmp/data-schema.json && grep -q '"openapi_path":"/openapi.json"' /tmp/data-schema.json && grep -q '"openapi":"3.1.0"' /tmp/data-openapi.json; then
              echo 'NAKWOL_DATA_BOOTSTRAP_OK'; exit 0
            fi
            sleep 5
          done
          exit 1
