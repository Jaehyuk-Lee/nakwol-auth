name: Deploy NAKWOL AUTH

on:
  push:
    branches:
      - stable
    paths:
      - 'src/**'
      - 'packages/**'
      - 'migrations/**'
      - 'scripts/**'
      - '!scripts/apply-repository-governance.mjs'
      - '!scripts/verify-stable-promotion.mjs'
      - 'package.json'
      - 'tsconfig.json'
      - 'wrangler.jsonc'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
    inputs:
      preflight_only:
        description: Check existing Worker configuration without changing production
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-auth-deploy.mjs
  deploy:
    needs: preflight
    if: ${{ inputs.preflight_only != true }}
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify stable PR promotion or stable manual ref
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/verify-stable-promotion.mjs --allow-head main --allow-prefix hotfix/
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      - name: Unit tests
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Bundle check
        run: npx wrangler deploy --dry-run --outdir .dry-run
      - name: Validate Cloudflare CI credentials
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then echo '::error::Missing repository secret CLOUDFLARE_API_TOKEN'; exit 1; fi
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then echo '::error::Missing repository secret CLOUDFLARE_ACCOUNT_ID'; exit 1; fi
          npx wrangler d1 list --json > /tmp/d1-auth-check.json
          grep -q 'nakwol-auth' /tmp/d1-auth-check.json
          echo 'CLOUDFLARE_CI_CREDENTIALS_OK'
      - name: Resolve existing NAKWOL AUTH D1
        run: node scripts/ensure-d1.mjs
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply DB --remote
      - name: Verify required applications
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute DB --remote --json --command "SELECT client_id,status FROM applications WHERE client_id IN ('nakwol-auth-selftest','nakwol-connect-admin','nakwol-connect-cli','nakwol-data-lab','nakwol-data-ops','nakwol-my-data','siege-calculator') ORDER BY client_id;" > /tmp/apps.json
          grep -q 'nakwol-auth-selftest' /tmp/apps.json
          grep -q 'nakwol-connect-admin' /tmp/apps.json
          grep -q 'nakwol-connect-cli' /tmp/apps.json
          grep -q 'nakwol-data-lab' /tmp/apps.json
          grep -q 'nakwol-data-ops' /tmp/apps.json
          grep -q 'nakwol-my-data' /tmp/apps.json
          grep -q 'siege-calculator' /tmp/apps.json
      - name: Wait for required DATA v0.9 contract
        shell: bash
        run: |
          set -euo pipefail
          origin='https://nakwol-data.sepsd21.workers.dev'
          for i in {1..24}; do
            health=$(curl -sS -H 'Cache-Control: no-cache' -o /tmp/required-data-health.json -w '%{http_code}' "$origin/api/health" || true)
            schema=$(curl -sS -H 'Cache-Control: no-cache' -o /tmp/required-data-schema.json -w '%{http_code}' "$origin/api/schema" || true)
            openapi=$(curl -sS -H 'Cache-Control: no-cache' -o /tmp/required-data-openapi.json -w '%{http_code}' "$origin/openapi.json" || true)
            echo "attempt=$i health=$health schema=$schema openapi=$openapi"
            if [ "$health" = '200' ] && [ "$schema" = '200' ] && [ "$openapi" = '200' ] && \
               grep -q '"service":"nakwol-data"' /tmp/required-data-health.json && \
               grep -q '"version":"0.9.0"' /tmp/required-data-health.json && \
               grep -q '"schema_version":3' /tmp/required-data-schema.json && \
               grep -q '"openapi_path":"/openapi.json"' /tmp/required-data-schema.json && \
               grep -q '"openapi":"3.1.0"' /tmp/required-data-openapi.json && \
               grep -q '"version":"0.9.0"' /tmp/required-data-openapi.json; then
              echo 'NAKWOL_DATA_V09_READY_FOR_AUTH_DEPLOY'
              exit 0
            fi
            sleep 5
          done
          echo '::error::NAKWOL DATA v0.9/OpenAPI is not ready; refusing AUTH/Connect deploy.'
          cat /tmp/required-data-health.json || true
          cat /tmp/required-data-schema.json || true
          cat /tmp/required-data-openapi.json || true
          exit 1
      - name: Deploy existing Worker without replacing dashboard variables
        run: npx wrangler deploy --keep-vars
      - name: Verify production AUTH and Connect v0.6 distribution
        shell: bash
        run: |
          set -euo pipefail
          origin='https://nakwol-auth.sepsd21.workers.dev'
          for i in {1..18}; do
            hs=$(curl -sS -H 'Cache-Control: no-cache' -o /tmp/health -w '%{http_code}' "$origin/api/health" || true)
            ss=$(curl -sS -H 'Cache-Control: no-cache' -o /tmp/sdk -w '%{http_code}' "$origin/sdk/v0.3.2/nakwol-auth-web.js" || true)
            cs=$(curl -sS -H 'Cache-Control: no-cache' -o /tmp/connect -w '%{http_code}' "$origin/connect/v1.js" || true)
            xm=$(curl -sS -H 'Cache-Control: no-cache' -o /tmp/connect-manifest -w '%{http_code}' "$origin/connect/manifest.json" || true)
            cm=$(curl -sS -H 'Cache-Control: no-cache' -o /tmp/cli-manifest -w '%{http_code}' "$origin/connect/cli/manifest.json" || true)
            cp=$(curl -sS -H 'Cache-Control: no-cache' -o /tmp/cli-package -w '%{http_code}' "$origin/connect/cli/package.tgz" || true)
            ll=$(curl -sS -H 'Cache-Control: no-cache' -o /tmp/llms -w '%{http_code}' "$origin/llms.txt" || true)
            dv=$(curl -sS -H 'Cache-Control: no-cache' -o /tmp/device -w '%{http_code}' "$origin/connect/cli/device/verify" || true)
            echo "attempt=$i health=$hs sdk=$ss connect=$cs connect_manifest=$xm cli_manifest=$cm cli_package=$cp llms=$ll device=$dv"
            if [ "$hs" = '200' ] && [ "$ss" = '200' ] && [ "$cs" = '200' ] && [ "$xm" = '200' ] && [ "$cm" = '200' ] && [ "$cp" = '200' ] && [ "$ll" = '200' ] && [ "$dv" = '200' ]; then
              if grep -q '"service":"nakwol-auth"' /tmp/health && \
                 grep -q "NAKWOL_AUTH_SDK_VERSION = '0.3.2'" /tmp/sdk && \
                 grep -q 'window.NAKWOL_DATA' /tmp/connect && \
                 grep -q 'openapi: dataOpenApi' /tmp/connect && \
                 grep -q "script.dataset.auth || 'required'" /tmp/connect && \
                 grep -q 'data-nakwol-connect-auth-guard' /tmp/connect && \
                 grep -q '"sdk":"/sdk/v0.3.2/nakwol-auth-web.js"' /tmp/connect-manifest && \
                 grep -q '"default_auth":"required"' /tmp/connect-manifest && \
                 grep -q '"default_access_policy":"member"' /tmp/connect-manifest && \
                 grep -q '"name":"nakwol-connect"' /tmp/cli-manifest && \
                 grep -q '"version":"0.6.2"' /tmp/cli-manifest && \
                 grep -q '"default_auth":"required"' /tmp/cli-manifest && \
                 grep -q '"default_access_policy":"member"' /tmp/cli-manifest && \
                 grep -q 'init --auth optional' /tmp/cli-manifest && \
                 grep -q 'data describe --json' /tmp/cli-manifest && \
                 grep -q 'openapi.json' /tmp/cli-manifest && \
                 grep -qi 'authentication policy is REQUIRED BY DEFAULT' /tmp/llms && \
                 grep -q 'auth = required' /tmp/llms && \
                 grep -q 'access_policy = member' /tmp/llms && \
                 grep -q 'init --auth optional' /tmp/llms && \
                 grep -q 'OpenAPI' /tmp/llms && \
                 grep -q 'CLI 연결 승인' /tmp/device && \
                 test -s /tmp/cli-package; then
                echo 'NAKWOL_CONNECT_V06_DEPLOY_OK'
                exit 0
              fi
            fi
            sleep 5
          done
          echo '::error::NAKWOL Connect v0.6 deployment verification failed.'
          echo '--- Connect manifest ---'
          cat /tmp/connect-manifest || true
          echo
          echo '--- CLI manifest ---'
          cat /tmp/cli-manifest || true
          echo
          echo '--- LLM guidance head ---'
          head -80 /tmp/llms || true
          exit 1
